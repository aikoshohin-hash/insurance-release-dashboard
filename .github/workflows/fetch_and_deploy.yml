# 保険リリース自動取得 & GitHub Pages デプロイ
#
# トリガー:
#   1. 毎日 9:00 JST (0:00 UTC) に自動実行
#   2. GitHub UI / API からの手動トリガー (workflow_dispatch)
#   3. main ブランチへの push
#
# 動作:
#   1. Python 環境セットアップ
#   2. main.py でデータ取得 → HTMLレポート生成
#   3. GitHub Pages にデプロイ (gh-pages ブランチ)

name: Fetch & Deploy Report

on:
  schedule:
    # 23:17 UTC = 翌 08:17 JST
    #
    # 以前は '0 0 * * *'（= 9:00 JST 狙い）だったが、実測では連日
    # 03:42〜03:56 UTC に起動しており、約4時間遅れて JST 12:45 頃に
    # 更新されていた。0:00 UTC は毎時0分かつ日付境界という最混雑スロットで、
    # GitHub のスケジュール実行は常に「遅れる」方向にのみずれるため。
    # 要求窓の下端に置き、分を0以外にしてスパイクを避ける。
    - cron: '17 23 * * *'
  workflow_dispatch:
    # GitHub UI/API から手動トリガー可能
    inputs:
      company:
        description: '取得対象会社 (空欄=全社)'
        required: false
        default: ''
      test_notify:
        description: 'テスト通知を起票する（現在の上位3件を【テスト】Issueとして起票。台帳は変えない）'
        type: boolean
        required: false
        default: false
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'requirements.txt'

# GitHub Pages デプロイ用の権限
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write     # 新規検知を Issue として起票し、GitHub の通知メールで知らせるため

# スナップショット保存前に殺されると状態が壊れるため、実行中のジョブは止めない
concurrency:
  group: fetch-and-deploy
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    # ランナーは UTC。23:17 UTC 起動だと日本の日付と1日ずれ、メール件名の日付・
    # 検知日(first_seen)・鮮度判定・ダッシュボードの作成時刻が前日扱いになる。
    env:
      TZ: Asia/Tokyo
    # 本文/PDF エンリッチで最大100件ほど取得するため v3(15分)から拡大
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch releases and generate report
        env:
          PYTHONIOENCODING: utf-8
          # 新規検知は GitHub Issue で通知する（秘密情報は使わない）。対象は商品リリースのみ
          NOTIFY_TIERS: PRODUCT
          TEST_NOTIFY: ${{ github.event.inputs.test_notify }}
        run: |
          # 手動トリガー時に会社指定がある場合
          COMPANY_ARG=""
          if [ -n "${{ github.event.inputs.company }}" ]; then
            COMPANY_ARG="--company ${{ github.event.inputs.company }}"
          fi

          # データ取得 & HTMLレポート生成 (Google Sheets はスキップ)
          python main.py --no-gsheet $COMPANY_ARG

      # 本文エンリッチのキャッシュを main に書き戻す。
      #   ・同じURLを毎日取りに行かないため（相手サイトへの負荷と実行時間を抑える）
      #   ・利率の履歴が git 履歴としてそのまま残るため
      # actions/cache は使わない（7日無アクセスで消え、消えると全件取り直しになる）。
      # GITHUB_TOKEN による push は workflow を再発火しない仕様なので無限ループしない。
      # data/enrichment.json（本文キャッシュ）と data/seen.json（新規検知の台帳）を書き戻す。
      # 台帳が消えると翌日に全件が「新規」として通知されるため、ここは必ず残す。
      - name: Commit data (enrichment cache & seen ledger)
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: データ更新 本文キャッシュ・検知台帳 ($(date -u '+%Y-%m-%d'))"
            # 実行中に main へ手動 push があっても衝突しないよう、rebase してから送る
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "data/ に変化なし"
          fi

      # 新規検知の内容を Actions の実行サマリーにも出す（メールを見逃しても後から追える）
      - name: Write job summary
        if: always()
        run: |
          if [ -f output/notify.md ]; then
            cat output/notify.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "本日の新規検知: 0件" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 新規があった日だけ Issue を起票する。GitHub が Watch しているアカウントの
      # 登録メールへ通知メールを送る。GITHUB_TOKEN だけで完結し、秘密情報は使わない。
      # 台帳のコミット(前のステップ)が成功してから起票する。台帳の保存に失敗した日は
      # 起票せず、翌日あらためて同じものを検知させる（取りこぼしも二重通知も起きない）。
      # 起票に失敗した場合はステップが失敗し、GitHub の「ワークフロー失敗」メールで気づける。
      - name: Open issue for new releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f output/notify.md ] || [ -f output/notify_test.md ]; then
            gh label create new-release --color 0E8A16 \
              --description "新規検知した商品リリース" 2>/dev/null || true
          fi
          if [ -f output/notify.md ]; then
            gh issue create --title "$(cat output/notify_title.txt)" \
              --label new-release --body-file output/notify.md
          fi
          if [ -f output/notify_test.md ]; then
            gh issue create --title "$(cat output/notify_test_title.txt)" \
              --label new-release --body-file output/notify_test.md
          fi

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy

          # 最新のHTMLレポートをコピー
          LATEST_REPORT=$(ls -t output/report_*.html 2>/dev/null | head -1)
          if [ -n "$LATEST_REPORT" ]; then
            cp "$LATEST_REPORT" deploy/index.html
            echo "Deployed: $LATEST_REPORT"
          else
            echo "No HTML report found!"
            exit 1
          fi

          # Excelも保存 (ダウンロード用)
          LATEST_EXCEL=$(ls -t output/releases_*.xlsx 2>/dev/null | head -1)
          if [ -n "$LATEST_EXCEL" ]; then
            cp "$LATEST_EXCEL" deploy/latest.xlsx
          fi

          # .nojekyll (GitHub Pages の Jekyll ビルドを無効化)
          touch deploy/.nojekyll

          # robots.txt (検索エンジンのクロール・インデックスを拒否)
          cat > deploy/robots.txt << 'ROBOTS'
          User-agent: *
          Disallow: /
          ROBOTS

          echo "Deploy directory contents:"
          ls -la deploy/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true
          commit_message: "Update report - $(date '+%Y/%m/%d %H:%M JST')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: output/
          retention-days: 30
